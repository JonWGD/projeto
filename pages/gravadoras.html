<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Painel Administrativo | Gravadoras</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-body-tertiary">

    <!-- Menu Lateral -->
    <aside class="col-4 col-md-3 col-xl-2 position-fixed min-vh-100 bg-dark text-white p-3">
        <a href="painel-admin.html" class="d-block text-white text-decoration-none fw-bold fs-5 mb-1">ISRC</a>
        <p class="small text-white-50 mb-4">Painel Administrativo</p>

        <nav class="nav nav-pills flex-column gap-2">
            <a class="nav-link text-white-50" href="registros.html">Registros</a>
            <a class="nav-link active" href="#">Gravadoras</a>
            <a class="nav-link text-white-50" href="lancamentos.html">Lançamentos</a>
        </nav>
    </aside>

    <!-- Bloco Principal -->
    <main class="col-8 col-md-9 col-xl-10 ms-auto p-3 p-md-4 p-xl-5">

        <!-- Sessão: Pesquisa -->
        <section class="card border-0 shadow-sm p-3 p-md-4 mb-4">
            <h2 class="h5 mb-3">Pesquisar gravadoras</h2>

            <form class="row g-3 align-items-end">
                <div class="col-lg-4">
                    <label for="pesquisa-gravadora" class="form-label">Gravadora</label>
                    <input type="search" id="pesquisa-gravadora" name="gravadora" class="form-control"
                        placeholder="Nome da gravadora">
                </div>

                <div class="col-lg-4">
                    <label for="pesquisa-pais" class="form-label">País</label>
                    <input type="search" id="pesquisa-pais" name="pais" class="form-control"
                        placeholder="País da gravadora">
                </div>

                <div class="col-lg-4">
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-outline-primary flex-fill">Pesquisar</button>
                        <button type="button" class="btn btn-primary flex-fill" popovertarget="popover-registro"
                            popovertargetaction="show">
                            + Registrar</button>
                    </div>
                </div>
            </form>
        </section>

        <!-- Sessão: Tabela -->
        <section class="card border-0 shadow-sm table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th scope="col" class="ps-3">Nome</th>
                        <th scope="col">Pais</th>
                        <th scope="col">Prefixo</th>
                        <th scope="col">Data de Registro</th>
                        <th scope="col">Contato</th>
                        <th scope="col">Ações</th>
                    </tr>
                </thead>

                <!-- PESQUISAR COMO UTILIZAR TAMPLATE! -->
                <tbody>
                    <tr>
                        <td class="ps-3 py-3 fw-semibold">MJJ</td>
                        <td>Estados Unidos</td>
                        <td>USSM1</td>
                        <td>11/11/2026</td>
                        <td>infomjj@epic.com</td>
                        <td>
                            <div class="d-flex gap-2">
                                <button type="button" class="btn btn-sm btn-outline-primary">Editar</button>
                                <button type="button" class="btn btn-sm btn-outline-danger">Excluir</button>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>
    <!-- Popover -->
    <div id="popover-registro" popover role="dialog"
        class="col-11 col-md-8 col-lg-7 col-xl-5 border-0 rounded-3 shadow-lg bg-body mh-100 overflow-y-auto">

        <!-- Formulário -->
        <form id="form-registro" class="row g-3 p-4 m-0">

            <div class="col-12">
                <label for="nome" class="form-label">Nome</label>
                <input type="text" id="nome" name="nome" class="form-control" placeholder="Nome da gravadora" required>
            </div>

            <div class="col-12">
                <label for="pais" class="form-label">País</label>
                <input type="text" id="pais" name="pais" class="form-control" placeholder="País da gravadora" required>
            </div>

            <div class="col-12 col-sm-6">
                <label for="prefixo" class="form-label">Prefixo</label>
                <input type="text" id="prefixo" name="prefixo" class="form-control" placeholder="Ex.: BRGR1" required>
            </div>

            <div class="col-12 col-sm-6">
                <label for="contato" class="form-label">Contato</label>
                <input type="email" id="contato" name="contato" class="form-control" placeholder="Email do contato"
                    required>
            </div>

            <!-- Botões -->
            <div class="col-12 d-flex justify-content-end gap-3 border-top pt-3 mt-4">
                <button type="button" class="btn btn-outline-secondary" popovertarget="popover-registro" popovertargetaction="hide">
                    Cancelar
                </button>

                <button type="submit" class="btn btn-primary">
                    Salvar registro
                </button>
            </div>
        </form>
    </div>
</body>

</html>
