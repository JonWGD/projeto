<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Painel Administrativo | Lançamentos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-body-tertiary">

    <!-- Menu Lateral -->
    <aside class="col-4 col-md-3 col-xl-2 position-fixed min-vh-100 bg-dark text-white p-3">
        <a href="painel-admin.html" class="d-block text-white text-decoration-none fw-bold fs-5 mb-1">ISRC</a>
        <p class="small text-white-50 mb-4">Painel Administrativo</p>

        <nav class="nav nav-pills flex-column gap-2">
            <a class="nav-link text-white-50" href="registros.html">Registros</a>
            <a class="nav-link text-white-50" href="gravadoras.html">Gravadoras</a>
            <a class="nav-link active" href="#">Lançamentos</a>
        </nav>
    </aside>

    <!-- Bloco Principal -->
    <main class="col-8 col-md-9 col-xl-10 ms-auto p-3 p-md-4 p-xl-5">

        <!-- Sessão: Pesquisa -->
        <section class="card border-0 shadow-sm p-3 p-md-4 mb-4">
            <h2 class="h5 mb-3">Pesquisar lançamentos</h2>

            <form id="form-pesquisa" class="row g-3 align-items-end">
                <div class="col-lg-4">
                    <label for="pesquisa-artista" class="form-label">Artista</label>
                    <input type="search" id="pesquisa-artista" name="artista" class="form-control"
                        placeholder="Nome do artista">
                </div>

                <div class="col-lg-4">
                    <label for="pesquisa-lancamento" class="form-label">Lançamento</label>
                    <input type="search" id="pesquisa-lancamento" name="lancamento" class="form-control"
                        placeholder="Nome do lançamento">
                </div>

                <div class="col-lg-4">
                    <div class="d-flex gap-2">
                        <button id="botao-pesquisar" type="submit"
                            class="btn btn-outline-primary flex-fill">Pesquisar</button>
                        <button id="botao-registrar" type="button" class="btn btn-primary flex-fill">
                            + Registrar</button>
                    </div>
                </div>
            </form>
        </section>

        <!-- Sessão: Tabela -->
        <section class="card border-0 shadow-sm table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th scope="col" class="ps-3">Artista</th>
                        <th scope="col">Título</th>
                        <th scope="col">Versão</th>
                        <th scope="col">Quantidade de Faixas</th>
                        <th scope="col">UPC</th>
                        <th scope="col">Ações</th>
                    </tr>
                </thead>

                <tbody id="tabela"></tbody>
            </table>

            <!-- Template: Tabela -->
            <template id="template">
                <tr>
                    <td data-campo="artista" class="ps-3"></td>
                    <td data-campo="titulo"></td>
                    <td data-campo="versao"></td>
                    <td data-campo="quantidadeFaixas"></td>
                    <td data-campo="upc"></td>
                    <td>
                        <div class="d-flex gap-2">
                            <button type="button" class="btn btn-outline-primary btn-sm">Editar</button>
                            <button type="button" class="btn btn-outline-danger btn-sm">Excluir</button>
                        </div>
                    </td>
                </tr>
            </template>
        </section>

    </main>

    <!-- Popover -->
    <div id="popover-registro" popover="manual"
        class="col-11 col-md-8 col-lg-7 col-xl-5 border-0 rounded-3 shadow-lg bg-body mh-100 overflow-y-auto">

        <!-- Popover: Formulário -->
        <form id="form-registro" class="row g-3 p-4 m-0">

            <div class="col-12">
                <label for="artista" class="form-label">Artista</label>
                <input type="text" id="artista" name="artista" class="form-control" placeholder="Nome do artista"
                    required>
            </div>

            <div class="col-12">
                <label for="titulo" class="form-label">Título</label>
                <input type="text" id="titulo" name="titulo" class="form-control" placeholder="Título do lançamento"
                    required>
            </div>

            <div class="col-12 col-sm-6">
                <label for="versao" class="form-label">Versão</label>
                <input type="text" id="versao" name="versao" class="form-control" placeholder="Ex.: Edição Deluxe">
            </div>

            <div class="col-12 col-sm-6">
                <label for="upc" class="form-label">UPC</label>
                <input type="text" id="upc" name="upc" class="form-control" inputmode="numeric" pattern="[0-9]{12}"
                    placeholder="Ex.: 088644455735" required>
            </div>

            <!-- Botões -->
            <div class="col-12 d-flex justify-content-end gap-3 border-top pt-3 mt-4">
                <button id="botao-cancelar" type="button" class="btn btn-outline-secondary">
                    Cancelar
                </button>

                <button id="botao-confirmar" type="submit" class="btn btn-primary">
                    Salvar registro
                </button>
            </div>
        </form>
    </div>
    <script src="../js/lancamentos.js" defer></script>
</body>

</html>
