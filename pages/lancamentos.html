<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Painel Administrativo | Lançamentos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-body-tertiary">

    <!-- Menu Lateral -->
    <aside class="col-4 col-md-3 col-xl-2 position-fixed min-vh-100 bg-dark text-white p-3">
        <a href="painel-admin.html" class="d-block text-white text-decoration-none fw-bold fs-5 mb-1">ISRC</a>
        <p class="small text-white-50 mb-4">Painel Administrativo</p>

        <nav class="nav nav-pills flex-column gap-2">
            <a class="nav-link text-white-50" href="registros.html">Registros</a>
            <a class="nav-link text-white-50" href="gravadoras.html">Gravadoras</a>
            <a class="nav-link active" href="#">Lançamentos</a>
        </nav>
    </aside>

    <!-- Bloco Principal -->
    <main class="col-8 col-md-9 col-xl-10 ms-auto p-3 p-md-4 p-xl-5">

        <!-- Sessão: Pesquisa -->
        <section class="card border-0 shadow-sm p-3 p-md-4 mb-4">
            <h2 class="h5 mb-3">Pesquisar lançamentos</h2>

            <form class="row g-3 align-items-end">
                <div class="col-lg-4">
                    <label for="pesquisa-artista" class="form-label">Artista</label>
                    <input type="search" id="pesquisa-artista" name="artista" class="form-control"
                        placeholder="Nome do artista">
                </div>

                <div class="col-lg-4">
                    <label for="pesquisa-lancamento" class="form-label">Lançamento</label>
                    <input type="search" id="pesquisa-lancamento" name="lancamento" class="form-control"
                        placeholder="Nome do lançamento">
                </div>

                <div class="col-lg-4">
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-outline-primary flex-fill">Pesquisar</button>
                        <button type="button" class="btn btn-primary flex-fill">+ Registrar</button>
                    </div>
                </div>
            </form>
        </section>

        <!-- Sessão: Tabela -->
        <section class="card border-0 shadow-sm table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th scope="col" class="ps-3">Artista</th>
                        <th scope="col">Título</th>
                        <th scope="col">Versão</th>
                        <th scope="col">Quantidade de Faixas</th>
                        <th scope="col">UPC</th>
                        <th scope="col">Ações</th>
                    </tr>
                </thead>

                <!-- PESQUISAR COMO UTILIZAR TAMPLATE! -->
                <tbody>
                    <tr>
                        <td class="ps-3 py-3 fw-semibold">Michael Jackson</td>
                        <td>XSCAPE</td>
                        <td>Sony Xperia Lounge</td>
                        <td>9</td>
                        <td>0886444557351</td>
                        <td>
                            <div class="d-flex gap-2">
                                <button type="button" class="btn btn-sm btn-outline-primary">Editar</button>
                                <button type="button" class="btn btn-sm btn-outline-danger">Excluir</button>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>

    </main>

</body>

</html>
