<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISRC ADMIN PANEL</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="d-flex">
        <!-- Menu lateral -->
        <aside class="sidenav bg-dark min-vh-100 p-3">
            <h4 class="text-white ms-3 mt-3 mb-3 me-5">ISRC Admin Panel</h4>
            <nav class="nav flex-column">
                <a class="nav-link active" href="#">ISRC</a>
                <a class="nav-link" href="#">Gravadoras</a>
                <a class="nav-link" href="#">Lançamentos</a>
                <a class="nav-link" href="#">Artistas</a>
            </nav>
        </aside>

        <main class="flex-grow-1 p-4">
            <table class="table table-striped table-hover">
                <thead>
                    <tr>
                        <th scope="col">Artista</th>
                        <th scope="col">Titulo</th>
                        <th scope="col">Versão</th>
                        <th scope="col">Ano</th>
                        <th scope="col">Duração</th>
                        <th scope="col">ISRC</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Michael Jackson</td>
                        <td>Chicago</td>
                        <td>Papercha$er Remix</td>
                        <td>2014</td>
                        <td>4:19</td>
                        <td>USSM11401761</td>
                    </tr>
                </tbody>
            </table>
        </main>
    </div>
</body>

</html>
